manifestVersion: 1
id: prisma-numerologapp
category: utilities
name: NumerologApp
version: "1.0.3"
tagline: Numerologia vedica privata e disponibile offline
icon: https://raw.githubusercontent.com/RobyCek/aurora-umbrel-store/main/prisma-numerologapp/icona.png
description: >-
  NumerologApp calcola il profilo di numerologia vedica usando nome e data di
  nascita. Mostra numero psichico, karma, firma, frequenza del nome, giorni e
  colori, calendario e tutte le combinazioni numerologiche disponibili.


  L'elaborazione avviene nel browser e nessun dato personale viene inviato a
  un servizio esterno. Il server Umbrel distribuisce soltanto file statici:
  non sono necessari database, Python, account o servizi cloud. Dopo il primo
  caricamento l'app può continuare a funzionare offline come PWA.
releaseNotes: >-
  Distribuzione aggiornata con un contenitore versionato, così Umbrel sostituisce
  correttamente l'interfaccia anche durante gli aggiornamenti. Include la
  navigazione tra Riepilogo, Numero del Carattere, Karma, Calendario e Colori,
  oltre a pianeti, indicatori più grandi e tabella settimanale ottimizzata.
