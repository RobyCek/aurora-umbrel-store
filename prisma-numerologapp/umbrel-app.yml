manifestVersion: 1
id: prisma-numerologapp
category: utilities
name: NumerologApp
version: "1.2.2"
tagline: Numerologia vedica con licenze personali e utilizzo offline
icon: https://raw.githubusercontent.com/RobyCek/aurora-umbrel-store/main/prisma-numerologapp/icona.png
description: >-
  Pannello di gestione delle licenze personali di NumerologApp. L'icona Umbrel
  apre il servizio autorevole sul NUC tramite la rete Tailscale privata, così
  i codici creati dal pannello sono gli stessi usati dalle app Apple, Android e
  macOS. Il precedente archivio locale Umbrel rimane conservato come backup ma
  non viene più usato per creare o convalidare codici.
releaseNotes: >-
  Unifica la gestione delle licenze sul NUC. Il pannello Umbrel ora inoltra al
  solo archivio autorevole usato dalle app distribuite, evitando codici creati
  nel vecchio archivio locale non sincronizzato.
developer: Prisma Informatica s.a.s.
