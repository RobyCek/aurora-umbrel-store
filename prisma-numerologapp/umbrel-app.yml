manifestVersion: 1
id: prisma-numerologapp
category: utilities
name: NumerologApp
version: "1.2.3"
tagline: Numerologia vedica con licenze personali e utilizzo offline
icon: https://raw.githubusercontent.com/RobyCek/aurora-umbrel-store/main/prisma-numerologapp/icona.png
description: >-
  NumerologApp calcola il profilo di numerologia vedica usando nome e data di
  nascita. Mostra numero psichico, karma, firma, frequenza del nome, giorni e
  colori, calendario e tutte le combinazioni numerologiche disponibili.


  L'elaborazione avviene sul dispositivo e nomi, date di nascita e consulti non
  vengono inviati a servizi esterni. Umbrel gestisce codici personali e licenze
  firmate che consentono l'utilizzo offline.
releaseNotes: >-
  Rende evidente il comando Copia messaggio completo dopo la creazione di una
  licenza. Il testo pronto da inviare include il link App Store, il codice
  assegnato e le istruzioni per l'attivazione. Aggiunge inoltre il comando
  Elimina per rimuovere definitivamente nominativi e licenze creati per errore,
  con una conferma prima della cancellazione.
