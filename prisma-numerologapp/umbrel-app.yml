manifestVersion: 1
id: prisma-numerologapp
category: utilities
name: NumerologApp
version: "1.1.0"
tagline: Numerologia vedica con licenze personali e utilizzo offline
icon: https://raw.githubusercontent.com/RobyCek/aurora-umbrel-store/main/prisma-numerologapp/icona.png
description: >-
  NumerologApp calcola il profilo di numerologia vedica usando nome e data di
  nascita. Mostra numero psichico, karma, firma, frequenza del nome, giorni e
  colori, calendario e tutte le combinazioni numerologiche disponibili.


  L'elaborazione avviene sul dispositivo e nomi, date di nascita e consulti non
  vengono inviati a servizi esterni. Umbrel gestisce codici personali associati
  a un solo dispositivo e licenze firmate che consentono l'utilizzo offline.
releaseNotes: >-
  Aggiunto il sistema di abilitazione personale per le app native. Ogni codice
  viene associato alla chiave crittografica di un solo dispositivo. Le licenze
  sono firmate e restano valide offline per 30 giorni. Un nuovo pannello
  amministrativo permette di creare, revocare e trasferire i codici senza
  raccogliere i dati personali usati nei calcoli numerologici.
