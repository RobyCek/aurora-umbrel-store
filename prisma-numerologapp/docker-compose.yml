services:
  app_proxy:
    environment:
      APP_HOST: prisma-numerologapp_server_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/robycek/numerologapp:1.0.4@sha256:f364985ceebbf84c8200243c33054044b5bb0ce785bd96b93b174ac0b2ba1c51
    restart: on-failure
    init: true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      default:
        aliases:
          - prisma-numerologapp_server_1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
