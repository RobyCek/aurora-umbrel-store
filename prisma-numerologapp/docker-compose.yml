services:
  app_proxy:
    environment:
      APP_HOST: prisma-numerologapp_server_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/robycek/numerologapp:1.2.1@sha256:76cb1a349dbe0b286d3cfcb2432a8548b7eb70ced39922b34ffa0702dac3bd27
    # Umbrel crea i nuovi bind mount come root. L'override e necessario solo
    # per scrivere nel volume persistente; il container resta senza capability,
    # senza privilegi aggiuntivi e con filesystem di sistema in sola lettura.
    user: "0:0"
    restart: on-failure
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      LICENSE_ADMIN_TOKEN: ${APP_PASSWORD}
      LICENSE_DATA_DIR: /data
      LICENSE_OFFLINE_DAYS: "30"
      PORT: "8080"
      WEB_DIR: /app/web
    volumes:
      - ${APP_DATA_DIR}/data/licenses:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      default:
        aliases:
          - prisma-numerologapp_server_1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
