services:
  app_proxy:
    environment:
      APP_HOST: prisma-numerologapp_gateway_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  # NumerologApp usa un solo archivio licenze, ospitato sul NUC. Questo gateway
  # mantiene l'accesso dal pannello Umbrel senza avviare una seconda istanza
  # del servizio e senza montare il vecchio volume licenze locale.
  gateway:
    image: ghcr.io/robycek/numerologapp:1.2.1@sha256:76cb1a349dbe0b286d3cfcb2432a8548b7eb70ced39922b34ffa0702dac3bd27
    user: "1000:1000"
    restart: on-failure
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - node
      - -e
      - >-
        const http=require('http');
        const target={hostname:'100.92.13.117',port:8104};
        http.createServer((request,response)=>{
          const upstream=http.request({
            ...target,
            path:request.url,
            method:request.method,
            headers:{...request.headers,host:target.hostname+':'+target.port},
          },(upstreamResponse)=>{
            response.writeHead(upstreamResponse.statusCode??502,upstreamResponse.headers);
            upstreamResponse.pipe(response);
          });
          upstream.on('error',()=>{
            if(!response.headersSent) response.writeHead(502,{'Content-Type':'application/json'});
            response.end(JSON.stringify({error:'Servizio licenze NUC non raggiungibile.'}));
          });
          request.pipe(upstream);
        }).listen(8080,'0.0.0.0');
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      default:
        aliases:
          - prisma-numerologapp_gateway_1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
