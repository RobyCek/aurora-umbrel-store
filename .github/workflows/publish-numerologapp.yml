name: Publish NumerologApp image

on:
  push:
    branches:
      - numerologapp-*
    paths:
      - .github/workflows/publish-numerologapp.yml
      - prisma-numerologapp/Dockerfile
      - prisma-numerologapp/nginx.conf
      - prisma-numerologapp/server/**
      - prisma-numerologapp/umbrel-app.yml
      - prisma-numerologapp/web/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        id: app
        shell: bash
        run: |
          version="$(sed -n 's/^version: "\([^"]*\)"/\1/p' prisma-numerologapp/umbrel-app.yml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: prisma-numerologapp
          file: prisma-numerologapp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/robycek/numerologapp:${{ steps.app.outputs.version }}

