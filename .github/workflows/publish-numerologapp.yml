name: Publish NumerologApp image

on:
  push:
    branches:
      - numerologapp-1.0.3-container
    paths:
      - .github/workflows/publish-numerologapp.yml
      - prisma-numerologapp/Dockerfile
      - prisma-numerologapp/nginx.conf
      - prisma-numerologapp/web/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: prisma-numerologapp
          file: prisma-numerologapp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/robycek/numerologapp:1.0.3

