# L'APP «AURORA» DEL NEGOZIO PRISMA PER UMBREL — 05/09/2026, Tappa 3.
#
# È lo stesso disegno di `server_casalingo/docker-compose.yml` nel repository
# Aurora (Tappa 2), scritto come lo vuole Umbrel:
#
#   app_proxy   il proxy di Umbrel: la porta 2960 del manifest arriva qui, e
#               da qui alla porta 8000 del server. `PROXY_AUTH_ADD: "false"`
#               perché Aurora ha già il suo login (JWT) e le app su iPhone,
#               Mac e Windows non possono mandare i cookie di Umbrel.
#   postgres    il database, in ${APP_DATA_DIR}/data/db (bind-mount: entra nei
#               backup di umbrelOS e sopravvive a riavvii e aggiornamenti).
#   server      Aurora, dall'immagine privata autorizzata di Prisma su ghcr.io.
#   backup      ogni notte alle 02:00 un pg_dump in ${APP_DATA_DIR}/data/backup,
#               ne tiene 30, e uno subito al primo avvio.
#   ai_worker   ritira dal database i lavori chiesti dai dispositivi mobili e
#               usa l'app Ollama ufficiale di Umbrel.
#
# I segreti (password del database, chiave segreta) li genera Umbrel da sé:
# vedi `exports.sh`. I nomi `prisma-aurora_<servizio>_1` sono quelli che
# Umbrel dà ai contenitori: su Umbrel tutte le app stanno sulla stessa rete,
# e «postgres» da solo potrebbe essere quello di un'altra app.
#
# Le immagini sono fissate con tag E digest, come Umbrel richiede: il digest
# di Aurora lo scrive l'azione GitHub nel suo riepilogo (oppure
# `aggiorna_immagini.sh`, da un computer con Docker). Dalla versione 1.0.3
# l'immagine Aurora contiene sia linux/amd64 sia linux/arm64.

services:
  app_proxy:
    environment:
      APP_HOST: prisma-aurora_server_1
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"

  postgres:
    # Postgres 18: è la versione di Aurora cloud (Railway, 18.6 al 05/09/2026),
    # e pg_dump deve essere almeno pari al server che legge. La stessa
    # immagine serve al servizio `backup` per lo stesso motivo.
    image: postgres:18.6-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: aurora
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: ${APP_PRISMA_AURORA_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - prisma-aurora_postgres_1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    image: ghcr.io/robycek/aurora-server-private:1.0.71@sha256:5f35d0c18adab5ce2a6bfe45f1a6d617b52cbc41c467ee331ff230f8956bd767
    restart: on-failure
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    tmpfs:
      - /tmp:size=1g,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    # Le credenziali OAuth Google, OneDrive, pCloud e Box appartengono a questa installazione,
    # non al database. Il file e' facoltativo e vive nei dati persistenti,
    # così un aggiornamento dell'app non lo sostituisce.
    env_file:
      - path: ${APP_DATA_DIR}/data/config/google_oauth.env
        required: false
    environment:
      DATABASE_URL: postgresql://aurora:${APP_PRISMA_AURORA_POSTGRES_PASSWORD}@prisma-aurora_postgres_1:5432/aurora
      SECRET_KEY: ${APP_PRISMA_AURORA_SECRET_KEY}
      JWT_SIGNING_KEY: ${APP_PRISMA_AURORA_JWT_SIGNING_KEY}
      # APP_PASSWORD è il codice deterministico che umbrelOS mostra nella
      # scheda dell'app; serve soltanto per creare il primo amministratore.
      AURORA_SETUP_TOKEN: ${APP_PASSWORD}
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      AURORA_DOCUMENTAZIONE_API: "0"
      AURORA_CORS_ORIGINI: ""
      ALGORITHM: HS256
      PORT: "8000"
      # La pagina di stato legge da qui la data dell'ultimo backup.
      AURORA_CARTELLA_BACKUP: /backup
    volumes:
      - ${APP_DATA_DIR}/data/backup:/backup:ro
    networks:
      default:
        aliases:
          - prisma-aurora_server_1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salute', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ai_worker:
    # Stessa immagine del server: contiene il worker e tutte le dipendenze
    # Python gia' verificate. Non espone alcuna porta pubblica.
    image: ghcr.io/robycek/aurora-server-private:1.0.71@sha256:5f35d0c18adab5ce2a6bfe45f1a6d617b52cbc41c467ee331ff230f8956bd767
    restart: on-failure
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aurora:${APP_PRISMA_AURORA_POSTGRES_PASSWORD}@prisma-aurora_postgres_1:5432/aurora
      # Endpoint documentato dall'app Ollama ufficiale di Umbrel. Il 4B
      # occupa circa la metà del 9B ed evita di saturare i 16 GB del server.
      OLLAMA_URL: http://ollama_ollama_1:11434
      OLLAMA_MODEL: qwen3.5:4b
    command: ["python", "worker_intelligenza.py"]

  backup:
    image: postgres:18.6-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: prisma-aurora_postgres_1
      PGUSER: aurora
      PGPASSWORD: ${APP_PRISMA_AURORA_POSTGRES_PASSWORD}
      PGDATABASE: aurora
      BACKUP_ORA: "02:00"
      BACKUP_QUANTI: "30"
    volumes:
      - ${APP_DATA_DIR}/data/backup:/backup
    # Lo script del backup sta QUI dentro e non in un file a parte: Umbrel,
    # quando aggiorna un'app, ricopia solo docker-compose.yml, exports.sh,
    # i template e gli hook — un `backup.sh` accanto resterebbe quello della
    # prima installazione. È lo stesso script di `server_casalingo/backup.sh`;
    # i `$$` sono `$` per Compose. Si ripristina con:
    #   pg_restore --clean --if-exists --no-owner -d aurora file.dump
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        ORA="$${BACKUP_ORA:-02:00}"
        QUANTI="$${BACKUP_QUANTI:-30}"
        CARTELLA="/backup"

        fai_backup() {
          nome="$${CARTELLA}/aurora_$$(date +%Y%m%d_%H%M).dump"
          tmp="$${nome}.parziale"
          echo "[backup] $$(date '+%d/%m/%Y %H:%M') inizio → $${nome}"
          if pg_dump -Fc -f "$${tmp}" && [ -s "$${tmp}" ]; then
            mv "$${tmp}" "$${nome}"
            echo "[backup] fatto ($$(du -h "$${nome}" | cut -f1))"
            ls -1 "$${CARTELLA}"/aurora_*.dump 2>/dev/null | sort | head -n -"$${QUANTI}" | while read -r vecchio; do
              rm -f "$${vecchio}" && echo "[backup] tolto $${vecchio}"
            done
          else
            rm -f "$${tmp}"
            echo "[backup] FALLITO: il database non ha risposto. Riprovo alla prossima ora prevista."
          fi
        }

        secondi_fino_a() {
          ora_h="$${1%%:*}"; ora_m="$${1##*:}"
          adesso=$$(date +%s)
          oggi=$$(date -d "$$(date +%Y-%m-%d) $${ora_h}:$${ora_m}:00" +%s 2>/dev/null)
          if [ -z "$${oggi}" ]; then
            echo 86400; return
          fi
          if [ "$${oggi}" -le "$${adesso}" ]; then
            oggi=$$((oggi + 86400))
          fi
          echo $$((oggi - adesso))
        }

        mkdir -p "$${CARTELLA}"
        if ! ls "$${CARTELLA}"/aurora_*.dump >/dev/null 2>&1; then
          fai_backup
        fi
        while true; do
          attesa=$$(secondi_fino_a "$${ORA}")
          echo "[backup] prossimo backup fra $$((attesa / 3600)) h $$(((attesa % 3600) / 60)) min (alle $${ORA})"
          sleep "$${attesa}"
          fai_backup
        done
