manifestVersion: 1
id: prisma-aurora
category: files
name: Aurora Server Manager
version: "1.0.132"
tagline: Controlla e gestisci Aurora Server sul tuo Umbrel
icon: https://raw.githubusercontent.com/RobyCek/aurora-umbrel-store/main/prisma-aurora/icona.png
description: >-
  Aurora è il gestionale dei contatti (CRM) di Prisma Informatica: persone,
  aziende, gruppi, progetti, opportunità, appuntamenti, attività, note, posta
  e documenti, in italiano, con le app per Mac, iPhone, iPad e Windows che
  lavorano sempre in locale e si sincronizzano con questo server.


  Questa app installa il server di Aurora sul tuo Umbrel: il database
  PostgreSQL con i dati, il server che le app di Aurora interrogano, il
  l'installazione guidata dell'Intelligenza locale e un backup automatico ogni notte
  (ne restano trenta, nella cartella dell'app, compresi nei backup di
  umbrelOS).


  Dopo l'installazione apri Aurora Server Manager dalla schermata di Umbrel: la pagina di
  stato ti chiede di creare il primo utente (l'amministratore). Usa come
  «codice primo accesso» la password che umbrelOS mostra nella scheda di
  Aurora. La pagina ti mostra poi
  l'indirizzo da scrivere nelle app di Aurora, in Impostazioni › Server
  › «Il mio server». L'accesso è protetto dal login di Aurora, non da quello
  di Umbrel: le app sul telefono e sul computer si collegano direttamente.


  Fuori casa il server si raggiunge con l'app Tailscale di Umbrel.
releaseNotes: >-
  Allinea Aurora Server Manager al nuovo installatore guidato: Umbrel viene
  presentato come server aziendale già pronto, con spiegazioni semplici su
  dati, manutenzione, continuità e Intelligenza locale. Database, allegati,
  configurazioni e copie esistenti restano intatti.

